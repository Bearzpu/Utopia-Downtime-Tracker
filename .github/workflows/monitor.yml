name: Uptime Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

# --- FIX #1: prevents two runs from colliding ---
# If a run is already in progress when the next scheduled one wants to
# start, the new one waits in a queue instead of racing the first one
# to commit. This is what was causing the merge conflict.
concurrency:
  group: uptime-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Run site check
        run: node scripts/check-site.mjs
        env:
          MONITOR_URL: ${{ vars.MONITOR_URL }}

      # --- FIX #2: commit step now retries instead of dying on conflict ---
      - name: Commit updated data
        run: |
          git config user.name "uptime-monitor-bot"
          git config user.email "actions@github.com"
          git add data/

          # If there's nothing new to commit, just stop here cleanly.
          git commit -m "Log uptime check $(date -u +%Y-%m-%dT%H:%M:%SZ)" || exit 0

          # Try to push. If another run snuck in first, pull the latest
          # changes and try again — up to 3 times — instead of failing.
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && exit 0
            echo "Push failed, retrying ($i)..."
            git rebase --abort || true
            sleep 5
          done

          echo "Could not push after 3 attempts."
          exit 1
